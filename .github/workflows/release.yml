name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GCP_PROJECT_ID: artictools-e5538
  GCS_BUCKET: artictools-releases
  GCS_RELEASES_PREFIX: javiserver/releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            args: --mac dmg zip
          - name: Windows
            os: windows-latest
            args: --win nsis --x64

    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          fetch-depth: 0

      - name: Setup Node
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build artifacts
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for signing_var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!signing_var:-}" ]; then
              unset "$signing_var"
            fi
          done

          npm run build:web
          npm run build:mcp-bridge
          npx electron-builder --publish never ${{ matrix.platform.args }}

      - name: Flatten release files
        shell: bash
        run: |
          # electron-builder outputs to release/${version}/ but electron-updater
          # expects latest*.yml at release root. Move everything up one level.
          if [ -d release/*/ ]; then
            shopt -s dotglob nullglob
            for dir in release/*/; do
              cp -r "$dir"* release/
              rm -rf "$dir"
            done
          fi

      - name: Upload release artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.platform.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub and Cloud Storage release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # actions/checkout v6.0.3
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0

      - name: Download release artifacts
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        # softprops/action-gh-release v3.0.0
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-assets/**/*
          fail_on_unmatched_files: true

      - name: Authenticate to Google Cloud
        # google-github-actions/auth v3.0.0
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_RELEASES_SERVICE_ACCOUNT_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        # google-github-actions/setup-gcloud v3.0.1
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Publish release to Cloud Storage
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          version_dir="${GITHUB_REF_NAME}"
          destination="gs://${GCS_BUCKET}/${GCS_RELEASES_PREFIX}"
          version_destination="${destination}/${version_dir}/"
          installer_assets=(
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.blockmap
          )
          metadata_assets=(release-assets/latest*.yml)

          if [ "${#installer_assets[@]}" -eq 0 ]; then
            echo "No installer artifacts were found."
            exit 1
          fi

          if [ "${#metadata_assets[@]}" -eq 0 ]; then
            echo "No update metadata files were found."
            exit 1
          fi

          VERSION_DIR="${version_dir}" node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const versionDir = process.env.VERSION_DIR;
          const metadataDir = 'release-assets';
          const metadataFiles = fs
            .readdirSync(metadataDir)
            .filter((file) => /^latest.*\.yml$/.test(file));

          for (const file of metadataFiles) {
            const filePath = path.join(metadataDir, file);
            const nextContent = fs
              .readFileSync(filePath, 'utf8')
              .replace(/^(\s*(?:- )?(?:url|path):\s*)(?!https?:\/\/|\/)(\S.*)$/gm, (match, prefix, value) => {
                const trimmedValue = value.trim();
                return trimmedValue.startsWith(`${versionDir}/`)
                  ? match
                  : `${prefix}${versionDir}/${trimmedValue}`;
              });

            fs.writeFileSync(filePath, nextContent);
          }
          NODE

          gcloud storage cp \
            --canned-acl=publicRead \
            --cache-control="public,max-age=31536000,immutable" \
            "${installer_assets[@]}" \
            "${version_destination}"

          gcloud storage cp \
            --canned-acl=publicRead \
            --cache-control="no-cache" \
            "${metadata_assets[@]}" \
            "${destination}/"

      - name: Verify published metadata
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://storage.googleapis.com/${GCS_BUCKET}/${GCS_RELEASES_PREFIX}"

          for metadata in latest.yml latest-mac.yml; do
            curl --fail --silent --show-error "${base_url}/${metadata}" --output "${metadata}"

            while read -r asset_path; do
              curl --fail --silent --show-error --head "${base_url}/${asset_path}" >/dev/null
            done < <(awk '/^[[:space:]]*(- )?(url|path): / { print $NF }' "${metadata}" | sort -u)
          done

      - name: Keep only five Cloud Storage releases
        shell: bash
        run: |
          set -euo pipefail

          destination="gs://${GCS_BUCKET}/${GCS_RELEASES_PREFIX}"
          version_list="$(mktemp)"
          delete_list="$(mktemp)"

          gcloud storage ls "${destination}/" > "${version_list}" || true

          node - "${version_list}" > "${delete_list}" <<'NODE'
          const fs = require('node:fs');
          const listPath = process.argv[2];
          const versions = new Set();

          for (const line of fs.readFileSync(listPath, 'utf8').split(/\r?\n/)) {
            const match = line.match(/\/(v\d+\.\d+\.\d+(?:[-+][^/]+)?)\/$/);
            if (match) {
              versions.add(match[1]);
            }
          }

          function parseVersion(value) {
            const match = value.match(/^v(\d+)\.(\d+)\.(\d+)(?:-([^+]+))?/);
            if (!match) {
              return null;
            }

            return {
              value,
              major: Number(match[1]),
              minor: Number(match[2]),
              patch: Number(match[3]),
              prerelease: match[4] || '',
            };
          }

          function compareVersions(left, right) {
            for (const key of ['major', 'minor', 'patch']) {
              if (left[key] !== right[key]) {
                return right[key] - left[key];
              }
            }

            if (!left.prerelease && right.prerelease) {
              return -1;
            }

            if (left.prerelease && !right.prerelease) {
              return 1;
            }

            return right.prerelease.localeCompare(left.prerelease);
          }

          const sortedVersions = [...versions]
            .map(parseVersion)
            .filter(Boolean)
            .sort(compareVersions);

          process.stdout.write(sortedVersions.slice(5).map((version) => version.value).join('\n'));
          NODE

          while read -r version_dir; do
            if [ -n "${version_dir}" ]; then
              gcloud storage rm --recursive "${destination}/${version_dir}/"
            fi
          done < "${delete_list}"

          mapfile -t legacy_root_assets < <(gcloud storage ls "${destination}/JaviServer-*" "${destination}/ArtiShell-*" 2>/dev/null || true)
          if [ "${#legacy_root_assets[@]}" -gt 0 ]; then
            gcloud storage rm "${legacy_root_assets[@]}"
          fi
