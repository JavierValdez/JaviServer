name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            args: --mac dmg zip
          - name: Windows
            os: windows-latest
            args: --win nsis --x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build artifacts
        shell: bash
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            export CSC_LINK='${{ secrets.CSC_LINK }}'
          fi
          if [ -n "${{ secrets.CSC_KEY_PASSWORD }}" ]; then
            export CSC_KEY_PASSWORD='${{ secrets.CSC_KEY_PASSWORD }}'
          fi
          if [ -n "${{ secrets.APPLE_ID }}" ]; then
            export APPLE_ID='${{ secrets.APPLE_ID }}'
          fi
          if [ -n "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" ]; then
            export APPLE_APP_SPECIFIC_PASSWORD='${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}'
          fi
          if [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            export APPLE_TEAM_ID='${{ secrets.APPLE_TEAM_ID }}'
          fi

          npm run build:web
          npm run build:mcp-bridge
          npx electron-builder --publish never ${{ matrix.platform.args }}

      - name: Flatten release files
        shell: bash
        run: |
          # electron-builder outputs to release/${version}/ but electron-updater
          # expects latest*.yml at release root. Move everything up one level.
          if [ -d release/*/ ]; then
            shopt -s dotglob nullglob
            for dir in release/*/; do
              cp -r "$dir"* release/
              rm -rf "$dir"
            done
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release after all assets are ready
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-assets/**/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
