name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GCP_PROJECT_ID: artictools-e5538
  GCS_BUCKET: artictools-releases
  GCS_RELEASES_PREFIX: javiserver/releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            os: macos-latest
            args: --mac dmg zip
          - name: Windows
            os: windows-latest
            args: --win nsis --x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build artifacts
        shell: bash
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            export CSC_LINK='${{ secrets.CSC_LINK }}'
          fi
          if [ -n "${{ secrets.CSC_KEY_PASSWORD }}" ]; then
            export CSC_KEY_PASSWORD='${{ secrets.CSC_KEY_PASSWORD }}'
          fi
          if [ -n "${{ secrets.APPLE_ID }}" ]; then
            export APPLE_ID='${{ secrets.APPLE_ID }}'
          fi
          if [ -n "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" ]; then
            export APPLE_APP_SPECIFIC_PASSWORD='${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}'
          fi
          if [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            export APPLE_TEAM_ID='${{ secrets.APPLE_TEAM_ID }}'
          fi

          npm run build:web
          npm run build:mcp-bridge
          npx electron-builder --publish never ${{ matrix.platform.args }}

      - name: Flatten release files
        shell: bash
        run: |
          # electron-builder outputs to release/${version}/ but electron-updater
          # expects latest*.yml at release root. Move everything up one level.
          if [ -d release/*/ ]; then
            shopt -s dotglob nullglob
            for dir in release/*/; do
              cp -r "$dir"* release/
              rm -rf "$dir"
            done
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish Cloud Storage release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_RELEASES_SERVICE_ACCOUNT_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Publish release to Cloud Storage
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          destination="gs://${GCS_BUCKET}/${GCS_RELEASES_PREFIX}/"
          installer_assets=(
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.blockmap
          )
          metadata_assets=(release-assets/latest*.yml)

          if [ "${#installer_assets[@]}" -eq 0 ]; then
            echo "No installer artifacts were found."
            exit 1
          fi

          if [ "${#metadata_assets[@]}" -eq 0 ]; then
            echo "No update metadata files were found."
            exit 1
          fi

          gcloud storage cp \
            --canned-acl=publicRead \
            --cache-control="public,max-age=31536000,immutable" \
            "${installer_assets[@]}" \
            "${destination}"

          gcloud storage cp \
            --canned-acl=publicRead \
            --cache-control="no-cache" \
            "${metadata_assets[@]}" \
            "${destination}"

      - name: Verify published metadata
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://storage.googleapis.com/${GCS_BUCKET}/${GCS_RELEASES_PREFIX}"

          curl --fail --silent --show-error --head "${base_url}/latest.yml" >/dev/null
          curl --fail --silent --show-error --head "${base_url}/latest-mac.yml" >/dev/null
